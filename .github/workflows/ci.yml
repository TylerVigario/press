name: CI

# Public repository, so minutes are free and uncapped, and CI fans out to one job per
# assertion: each job is a required context of its own, named for what it asserts, so a red one
# names the failure, and an assertion removed leaves a context that wedges the branch until the
# ruleset changes too. .github/rulesets/main.json requires every job here by its name.
#
#   On press's typst
#     Documents build        the calibration sheet compiles; and in jobs of their own, a rebuild
#                            leaves it unchanged, each template compiles where it stands and as
#                            new.sh scaffolds it, `all` builds a repo's documents and nothing
#                            else, and press.toml's version is the one the last release wrote.
#     Documents pass the audit
#                            press's own passes against the calibration sheet: typst warnings
#                            that exit 0 and ship, fonts that are not vendored, glyphs that
#                            vanished, ink inside the unprintable band, text on text; and in jobs
#                            of their own, .github/audit-cases/, documents with one known answer,
#                            so a false finding fixed once stays fixed, and each layout check, a
#                            .github/<name>.sh and the .typ it measures.
#     The release bundle installs and works
#                            the archives the release attaches, built from this tree: the kit
#                            and nothing of press's machinery, installed in a scratch repo as the
#                            README says, then used there with no just, and with the typst the
#                            kit installs, to scaffold, build and audit; and in jobs of their own,
#                            every typst digest the kit pins, against typst's release; both
#                            installers, served the bundle locally, installing, updating and
#                            refusing as they should; and a release's commit rebuilding the
#                            bundle it published.
#   On the oldest toolchain  each job above that builds or audits, again at the oldest typst and
#                            just press.just accepts, named the same with ", on the oldest
#                            toolchain", so a change that needs a newer one fails here, not on a
#                            machine still at the floor; and one that those are the floors press
#                            declares.
#   No invisible characters  soft hyphens and zero-width characters in any tracked
#                            file, which reach paper unseen and survive review.
#   Shell scripts lint       every *.sh in the tree, press.just's recipes and the
#                            toolchain action's run: blocks. tools/check.sh is the audit
#                            itself, and every defect found in it this far has been
#                            a shell defect — a pipeline exit masked by sort, a
#                            guard that asserted existence where ancestry was the
#                            question — so the script that judges every document is
#                            worth judging.
#   Workflows lint           actionlint over every workflow: expressions, contexts,
#                            job needs, action inputs, and shellcheck on each run:
#                            block. A workflow's own mistakes surface only when it
#                            runs, and the release workflow runs rarely.
#   Markdown lint            markdownlint over every tracked *.md but CHANGELOG.md, which
#                            the release writes. README.md and CLAUDE.md are how press is
#                            learned, by people and by agents, and a broken fence or table
#                            misleads both.
#   Every CI job is a required context, by a name GitHub keeps whole
#                            each job's name above, and the title check's, is one main.json
#                            requires, and each it requires is one of them, at 100 characters
#                            or fewer, past which GitHub cuts a check's name and the one required
#                            never arrives.
#   JSON parses              every tracked *.json. The ruleset payloads are applied
#                            by hand with gh api, and a payload that does not parse
#                            is found at the moment protection is being changed.
#
# Every repository that builds a document holds a copy of press, so a bad commit on
# main reaches all of them with the next release, before anyone notices. That is why
# this exists at all, and why it fans out rather than reporting one aggregate answer.

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow calls this as its gate, so nothing is released that a
  # merge would have refused. Concurrency below still keys on the caller's name and
  # ref, and only a pull request cancels an earlier run.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On press's typst. The first job of each kind of setup names its steps, and the others
  # repeat them by name.
  build:
    name: Documents build
    runs-on: ubuntu-latest
    # A job takes minutes at most. A hung step should fail rather than hold a runner, and the
    # pull request waiting on it, for six hours.
    timeout-minutes: &timeout 15
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &toolchain
        uses: ./.github/actions/typst-toolchain
      - run: just build calibration.typ

  version:
    name: press.toml's version is the one the last release wrote
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - &history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and the tags. The version check reads the tags, and bundle.sh
          # takes its time from the newest commit that is not a release's own: on the
          # push of a release: commit, that commit is all a one-commit checkout holds.
          fetch-depth: 0
          persist-credentials: false
      - run: sh .github/version-check.sh

  templates:
    name: The templates compile, in place and scaffolded
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain
      - run: sh .github/templates.sh

  rebuild:
    name: A rebuild leaves the document unchanged
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain
      - run: just build calibration.typ
      - run: sh .github/rebuild-unchanged.sh calibration.typ

  zone:
    name: The stamp prints in the zone .press.toml names, or UTC, on any machine
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain
      - run: sh .github/zone.sh

  all:
    name: all builds the documents, not their parts or press's files
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain
      - run: sh .github/all-check.sh

  audit:
    name: Documents pass the audit
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - &toolchain-poppler
        uses: ./.github/actions/typst-toolchain
        with:
          poppler: "true"
      - run: |
          set -euo pipefail
          # check compiles the document through stamp.sh, as build does, so it needs
          # no build ahead of it. A compile failure is Documents build's to report.
          just check calibration.typ

  audit-cases:
    name: The audit passes and refuses its known cases
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/audit-cases.sh

  reading-order:
    name: A résumé reads in the order it prints
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/reading-order.sh

  code-break:
    name: A code block a document lets break breaks, and one that fits moves whole
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/code-break.sh

  tall-parts:
    name: A part taller than a page breaks, and one that fits moves whole
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/tall-parts.sh

  label-break:
    name: A callout's, panel's or unit's label stays on the page with what it heads
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/label-break.sh

  caps:
    name: 'Every label press uppercases keeps its case under caps: false'
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/caps.sh

  stamp-break:
    name: A stamp's hairline stays on the page with its words
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/stamp-break.sh

  code-size:
    name: Code is set in press's face, inline to the text around it, a block boxed
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/code-size.sh

  list-spacing:
    name: Lines, list items and paragraphs are each further apart than the last
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/list-spacing.sh

  part-align:
    name: Inside a part, a flow is centred and a line aligned right ends at its edge
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/part-align.sh

  num:
    name: num() groups a number by thousands, and keeps its decimals and sign
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/num.sh

  addendum-size:
    name: An addendum's label is no larger than the entry it is under
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/addendum-size.sh

  head-gaps:
    name: A header, a == heading and a résumé entry keep their own gaps
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/head-gaps.sh

  units-gap:
    name: Units sit their spacing apart under every pack, and "stacks" balances by it
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/units-gap.sh

  sheet-across:
    name: A sheet across columns reads down each in turn, its last page balanced
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/sheet-across.sh

  sheet-row:
    name: A sheet's row that does not fit starts the next page whole
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/sheet-row.sh

  sources:
    name: A source is numbered by the list, which prints it short, its link whole
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/sources.sh

  quotes:
    name: A string's quotes curl as markup's, and code's and addresses' stay straight
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/quotes.sh

  form-fill:
    name: A form page is its blank's, and each answer lands where it is put
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-poppler
      - run: sh .github/form-fill.sh

  bundle:
    name: The release bundle installs and works
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *history
      - *toolchain-poppler
      - run: sh .github/bundle.sh "$RUNNER_TEMP/bundle"
      - run: sh .github/bundle-check.sh "$RUNNER_TEMP/bundle"

  digests:
    name: Every typst digest the kit pins is the release's
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - run: sh .github/typst-digests.sh

  fetch:
    name: fetch.sh tries a failed download again, and says how each try went
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - run: sh .github/fetch-tries.sh

  installers:
    name: Both installers install, update and refuse as they should, install.ps1 through PowerShell 7
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *history
      - run: sh .github/bundle.sh "$RUNNER_TEMP/bundle"
      - run: |
          set -euo pipefail
          # The runner image carries pwsh; install-check runs install.ps1 only where there is
          # one, so its absence here must fail rather than skip.
          pwsh --version
          sh .github/install-check.sh "$RUNNER_TEMP/bundle"

  bundle-rebuilds:
    name: A release's commit rebuilds the bundle it published
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *history
      - run: sh .github/bundle.sh "$RUNNER_TEMP/bundle"
      - run: |
          set -euo pipefail
          # The release run builds the bundle, then the forge records its release: commit, a
          # later one. Rebuilt from that commit, the bundle must still match its published sums.
          # Dated an hour on, so the two times differ.
          GIT_COMMITTER_DATE="@$(( $(git log -1 --format=%ct) + 3600 ))" \
            git -c user.name=ci -c user.email=ci@invalid commit -q --allow-empty -m "release: v0.0.0"
          sh .github/bundle.sh "$RUNNER_TEMP/rebuilt"
          diff "$RUNNER_TEMP/bundle/SHA256SUMS" "$RUNNER_TEMP/rebuilt/SHA256SUMS"

  # On the oldest typst and just press accepts: the same checks, so a change that needs a newer
  # one fails here, not on a machine still at the floor.
  oldest-floors:
    name: The oldest toolchain is the floors press declares
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - &toolchain-oldest
        uses: ./.github/actions/typst-toolchain
        with:
          poppler: "true"
          oldest: "true"
      - run: |
          set -euo pipefail
          # The toolchain action pins the floors by digest; press.toml declares typst's and
          # press.just just's. They must name the same versions, or the jobs on the oldest
          # toolchain test a floor nobody declared.
          want_typst=$(sed -n 's/^typst *= *"\(.*\)"$/\1/p' press.toml)
          want_just=$(sed -n "s/^set minimum-version := '\(.*\)'$/\1/p" press.just)
          have_typst=$(typst --version | cut -d' ' -f2)
          have_just=$(just --version | cut -d' ' -f2)
          if [ "$want_typst" != "$have_typst" ] || [ "$want_just" != "$have_just" ]; then
            echo "::error::press declares typst ${want_typst:-?} and just ${want_just:-?}; the toolchain action's oldest pins are typst $have_typst and just $have_just"
            exit 1
          fi
          echo "typst $have_typst and just $have_just, the floors press declares"

  oldest-build:
    name: Documents build on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: just build calibration.typ

  oldest:
    name: Documents pass on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: just check calibration.typ

  oldest-templates:
    name: The templates compile, in place and scaffolded, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/templates.sh

  oldest-rebuild:
    name: A rebuild leaves the document unchanged, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: just build calibration.typ
      - run: sh .github/rebuild-unchanged.sh calibration.typ

  oldest-zone:
    name: The stamp prints in the zone .press.toml names, or UTC, on any machine, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/zone.sh

  oldest-all:
    name: all builds the documents, not their parts or press's files, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/all-check.sh

  oldest-audit-cases:
    name: The audit passes and refuses its known cases, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/audit-cases.sh

  oldest-reading-order:
    name: A résumé reads in the order it prints, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/reading-order.sh

  oldest-code-break:
    name: A code block a document lets break breaks, and one that fits moves whole, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/code-break.sh

  oldest-tall-parts:
    name: A part taller than a page breaks, and one that fits moves whole, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/tall-parts.sh

  oldest-label-break:
    name: A callout's, panel's or unit's label stays on the page with what it heads, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/label-break.sh

  oldest-caps:
    name: 'Every label press uppercases keeps its case under caps: false, on the oldest toolchain'
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/caps.sh

  oldest-stamp-break:
    name: A stamp's hairline stays on the page with its words, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/stamp-break.sh

  oldest-code-size:
    name: Code is set in press's face, inline to the text around it, a block boxed, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/code-size.sh

  oldest-list-spacing:
    name: Lines, list items and paragraphs are each further apart than the last, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/list-spacing.sh

  oldest-part-align:
    name: Inside a part, a flow is centred and a line aligned right ends at its edge, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/part-align.sh

  oldest-num:
    name: num() groups a number by thousands, and keeps its decimals and sign, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/num.sh

  oldest-addendum-size:
    name: An addendum's label is no larger than the entry it is under, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/addendum-size.sh

  oldest-head-gaps:
    name: A header, a == heading and a résumé entry keep their own gaps, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/head-gaps.sh

  oldest-units-gap:
    name: Units sit their spacing apart under every pack, and "stacks" balances by it, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/units-gap.sh

  oldest-sheet-across:
    name: A sheet across columns reads down each in turn, its last page balanced, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/sheet-across.sh

  oldest-sheet-row:
    name: A sheet's row that does not fit starts the next page whole, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/sheet-row.sh

  oldest-sources:
    name: A source is numbered by the list, which prints it short, its link whole, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/sources.sh

  oldest-quotes:
    name: A string's quotes curl as markup's, and code's and addresses' stay straight, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/quotes.sh

  oldest-form-fill:
    name: A form page is its blank's, and each answer lands where it is put, on the oldest toolchain
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *toolchain-oldest
      - run: sh .github/form-fill.sh

  invisible:
    name: No invisible characters
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      # Reads the tree and nothing else: no toolchain, no fonts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git grep reads the index, so the whole tracked tree must be present.
          fetch-depth: 1
      - name: Scan
        run: |
          set -uo pipefail
          # U+00AD soft hyphen, U+200B..U+200D zero-width, U+2060 word joiner,
          # U+FEFF BOM.
          #
          # EVERY TRACKED FILE, not a list of extensions. This globbed *.typ and
          # *.md, while the job is named for the tree — a promise an extension list
          # cannot keep. A soft hyphen in a YAML comment or a shell string is
          # exactly as invisible and reaches a reader the same way. Demonstrated
          # rather than assumed: with one planted in .github/dependabot.yml, the old
          # scan exited 1 and reported the tree clean.
          #
          # `git grep` rather than `grep -r`, for three reasons that all matter here:
          #   · it searches the tracked tree by definition, so .git and print/ are
          #     excluded without naming them, and a file nobody committed cannot
          #     fail the build;
          #   · it is ONE process, so its exit code is grep's. Piping `git ls-files`
          #     into `xargs grep` would not be — xargs returns 123 when any
          #     invocation exits 1, so "no match" would stop looking like no match
          #     the moment the file list needed splitting;
          #   · -I skips binary files, which is what keeps fonts/*.ttf from being
          #     read as text and matching by coincidence.
          #
          # It exits 0 on a match, 1 on no match, and something else on error. An
          # `if git grep` would treat every error as "no match", so a scanner that
          # could not run at all would report the tree clean. `|| rc=$?` because the
          # runner invokes this as `bash -e`, where a bare 1 would abort before the
          # status could be read.
          rc=0
          out=$(git grep -nIP '[\x{00AD}\x{200B}-\x{200D}\x{2060}\x{FEFF}]') || rc=$?
          case "$rc" in
            0) printf '%s\n' "$out"
               echo "::error::invisible characters found — see the lines above"
               exit 1 ;;
            1) echo "no invisible characters in any tracked file" ;;
            *) echo "::error::the invisible-character scan itself failed (git grep exit $rc)"
               exit 1 ;;
          esac

  shell:
    name: Shell scripts lint
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # just, to dump press.just's recipes as it reads them.
      - *toolchain
      - name: shellcheck
        run: |
          set -euo pipefail
          # The runner's own shellcheck, which actionlint uses too.
          shellcheck --version | sed -n 2p
          # Every shell script in the tree, found rather than listed. A glob of
          # tools/*.sh was correct until a script appeared under .github/, and a
          # job called "Shell scripts lint" that misses one is overclaiming by the
          # width of whatever was added last.
          find . -path ./.git -prune -o -name '*.sh' -print0 \
            | xargs -0 --no-run-if-empty shellcheck --severity=warning
          # And the shell outside a *.sh file: press.just's recipes, and the toolchain action's
          # run: blocks, which actionlint does not read.
          out=$(mktemp -d)
          sh .github/embedded-shell.sh "$out"
          shellcheck --severity=warning "$out"/*.sh

  workflows:
    name: Workflows lint
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    env:
      # One job uses it, so it is installed here rather than by a shared script;
      # the version and its digest sit together, and a bump changes both.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up actionlint
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          sh tools/fetch.sh \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "$tmp/actionlint.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/actionlint.tar.gz" -C "$tmp" actionlint
          sudo install -m 0755 "$tmp/actionlint" /usr/local/bin/actionlint
          actionlint --version
      - name: actionlint
        # With no arguments it finds .github/workflows itself. shellcheck is on
        # the hosted runner, so every run: block is checked as a shell script
        # too, not only as YAML.
        run: actionlint

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: markdownlint-cli2
        # The CLI through npx at an exact version, not the markdownlint action: only
        # GitHub-owned actions may run here, as press's Actions settings allow, and the
        # node on the hosted runner is enough. Rules and ignores are
        # .markdownlint-cli2.jsonc. Dependabot does not see this pin; a bump is a
        # deliberate edit.
        run: npx --yes markdownlint-cli2@0.24.0

  contexts:
    name: Every CI job is a required context, by a name GitHub keeps whole
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - run: sh .github/contexts.sh

  timeouts:
    name: Every job stops at a timeout, so a hung step fails instead of holding a runner
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - run: sh .github/timeouts.sh

  json:
    name: JSON parses
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      # Reads the tree and nothing else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse every tracked JSON file
        run: |
          set -euo pipefail
          # Found rather than listed, like the shell lint: a payload added under
          # .github/rulesets/ is covered the day it lands. jq is on the hosted
          # runner. .jsonc is left to the tool that reads it, since jq does not
          # accept comments.
          n=0
          bad=0
          while IFS= read -r -d '' f; do
            n=$((n + 1))
            if ! err=$(jq empty "$f" 2>&1); then
              echo "::error file=$f::$err"
              bad=1
            fi
          done < <(git ls-files -z '*.json')
          echo "$n JSON file(s) checked"
          exit "$bad"
