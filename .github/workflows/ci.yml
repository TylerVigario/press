name: CI

# Public repository, so minutes are free and uncapped, and rule 9 fans out to one
# job per assertion rather than grouping them to save minutes.
#
#   Released versions are unchanged
#                            a package version directory that differs from the tag
#                            that released it. Consumers pin the version in their
#                            import and move the submodule pointer freely, which is
#                            safe only while a released version names fixed bits.
#   Documents build          typst compile errors.
#   Documents pass the audit press's own passes, run against its own document:
#                            typst warnings that exit 0 and ship, fonts that are
#                            not vendored, and ink inside the unprintable band.
#   No invisible characters  soft hyphens and zero-width characters in any tracked
#                            file, which reach paper unseen and survive review.
#   Shell scripts lint       every *.sh in the tree. tools/check.sh is the audit
#                            itself, and every defect found in it this far has been
#                            a shell defect — a pipeline exit masked by sort, a
#                            guard that asserted existence where ancestry was the
#                            question — so the script that judges every document is
#                            worth judging.
#   Workflows lint           actionlint over every workflow: expressions, contexts,
#                            job needs, action inputs, and shellcheck on each run:
#                            block. A workflow's own mistakes surface only when it
#                            runs, and the release workflow runs rarely.
#   Markdown lint            markdownlint over every tracked *.md. README.md and
#                            CLAUDE.md are how press is learned, by people and by
#                            agents, and a broken fence or table misleads both.
#
# press is vendored as a submodule by every repository that builds a document, so
# a bad commit on main reaches all of them before anyone notices. That is why this
# exists at all, and why it fans out rather than reporting one aggregate answer.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  released:
    name: Released versions are unchanged
    runs-on: ubuntu-latest
    steps:
      # Reads refs and trees and nothing else: no toolchain, no fonts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag and the commit it names. The default shallow clone has
          # neither, and a comparison against a tag that was never fetched cannot
          # run at all.
          fetch-depth: 0
          persist-credentials: false
      - name: Compare each released version with its tag
        run: |
          set -euo pipefail
          # A tag here names a package version: v0.1.0 releases
          # packages/vts/press/0.1.0/, and from that tag on the directory is
          # frozen. A change adds packages/vts/press/<next>/ instead.
          #
          # HEAD is what would land: the merge result on a pull request, the new
          # tip on a push to main. So an edit to a released directory is refused
          # before it merges, not reported after it has reached every submodule.
          #
          # `if git diff --quiet` fails closed: an error exits non-zero exactly as
          # a difference does, so a comparison that could not run reads as a
          # change rather than as a clean tree.
          released=0
          bad=0
          for tag in $(git tag --list 'v*'); do
            # Tags carry the v; the directory and typst.toml do not (rule 17).
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || continue
            version=${tag#v}
            dir="packages/vts/press/$version"
            released=$((released + 1))
            if ! git cat-file -e "$tag:$dir/typst.toml" 2>/dev/null; then
              echo "::error::$tag does not contain $dir/ — a tag here names a package version"
              bad=1
              continue
            fi
            if [ ! -f "$dir/typst.toml" ]; then
              echo "::error::$dir/ was released as $tag and has been removed"
              bad=1
              continue
            fi
            if git diff --quiet "$tag" HEAD -- "$dir"; then
              echo "$version: unchanged since $tag"
            else
              git diff --stat "$tag" HEAD -- "$dir"
              echo "::error::$dir/ differs from $tag. A released version is immutable — add the change under a new version directory."
              bad=1
            fi
          done
          [ "$released" -gt 0 ] || echo "no released versions yet, so nothing is frozen"
          exit "$bad"

  build:
    name: Documents build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/typst-toolchain
      - run: just all

  audit:
    name: Documents pass the audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/typst-toolchain
        with:
          poppler: "true"
      - name: Build, then audit
        run: |
          set -euo pipefail
          # check refuses to audit a document that was never built, and this is a
          # separate job with no artifact between them. The build is a precondition
          # here, not the assertion — a compile failure is Documents build's to report.
          just all
          for f in docs/*.typ; do just check "$f"; done

  invisible:
    name: No invisible characters
    runs-on: ubuntu-latest
    steps:
      # Reads the tree and nothing else: no toolchain, no fonts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git grep reads the index, so the whole tracked tree must be present.
          fetch-depth: 1
      - name: Scan
        run: |
          set -uo pipefail
          # U+00AD soft hyphen, U+200B..U+200D zero-width, U+2060 word joiner,
          # U+FEFF BOM.
          #
          # EVERY TRACKED FILE, not a list of extensions. This globbed *.typ and
          # *.md, while the job is named for the tree — a promise an extension list
          # cannot keep. A soft hyphen in a YAML comment or a shell string is
          # exactly as invisible and reaches a reader the same way. Demonstrated
          # rather than assumed: with one planted in .github/dependabot.yml, the old
          # scan exited 1 and reported the tree clean.
          #
          # `git grep` rather than `grep -r`, for three reasons that all matter here:
          #   · it searches the tracked tree by definition, so .git and print/ are
          #     excluded without naming them, and a file nobody committed cannot
          #     fail the build;
          #   · it is ONE process, so its exit code is grep's. Piping `git ls-files`
          #     into `xargs grep` would not be — xargs returns 123 when any
          #     invocation exits 1, so "no match" would stop looking like no match
          #     the moment the file list needed splitting;
          #   · -I skips binary files, which is what keeps fonts/*.ttf from being
          #     read as text and matching by coincidence.
          #
          # It exits 0 on a match, 1 on no match, and something else on error. An
          # `if git grep` would treat every error as "no match", so a scanner that
          # could not run at all would report the tree clean. `|| rc=$?` because the
          # runner invokes this as `bash -e`, where a bare 1 would abort before the
          # status could be read.
          rc=0
          out=$(git grep -nIP '[\x{00AD}\x{200B}-\x{200D}\x{2060}\x{FEFF}]') || rc=$?
          case "$rc" in
            0) printf '%s\n' "$out"
               echo "::error::invisible characters found — see the lines above"
               exit 1 ;;
            1) echo "no invisible characters in any tracked file" ;;
            *) echo "::error::the invisible-character scan itself failed (git grep exit $rc)"
               exit 1 ;;
          esac

  shell:
    name: Shell scripts lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # Every shell script in the tree, found rather than listed. A glob of
          # tools/*.sh was correct until a script appeared under .github/, and a
          # job called "Shell scripts lint" that misses one is overclaiming by the
          # width of whatever was added last.
          find . -path ./.git -prune -o -name '*.sh' -print0 \
            | xargs -0 --no-run-if-empty shellcheck --severity=warning

  workflows:
    name: Workflows lint
    runs-on: ubuntu-latest
    env:
      # One job uses it, so it is installed here rather than by a shared script;
      # the version and its digest sit together, and a bump changes both.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up actionlint
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$tmp/actionlint.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/actionlint.tar.gz" -C "$tmp" actionlint
          sudo install -m 0755 "$tmp/actionlint" /usr/local/bin/actionlint
          actionlint --version
      - name: actionlint
        # With no arguments it finds .github/workflows itself. shellcheck is on
        # the hosted runner, so every run: block is checked as a shell script
        # too, not only as YAML.
        run: actionlint

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: markdownlint-cli2
        # The CLI through npx at an exact version, not the markdownlint action:
        # only GitHub-owned actions may run here (rule 10), and the node on the
        # hosted runner is enough. Rules and ignores are .markdownlint-cli2.jsonc.
        # Dependabot does not see this pin; a bump is a deliberate edit.
        run: npx --yes markdownlint-cli2@0.23.3
