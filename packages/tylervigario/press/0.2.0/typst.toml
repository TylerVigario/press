[package]
name = "press"
version = "0.2.0"
# The oldest typst this package works with, the same floor press.just enforces for its
# recipes. typst itself refuses an older compiler at the import, naming both versions, so the
# floor holds for a bare `typst compile` and an editor too.
compiler = "0.14.0"
entrypoint = "lib.typ"
authors = ["Tyler Vigario"]
license = "AGPL-3.0-or-later"
description = "Ready-made parts and page presets for Typst documents, from a one-page sheet to a book, read on screen or on paper — never a template that owns the page."
categories = ["utility"]

# Declaring a template makes `typst init` scaffold a new document from the
# skeleton below. The skeleton is COPIED into the new project, not imported —
# which is the point: composition stays local and editable, while the
# vocabulary is imported and shared.
[template]
path = "template"
entrypoint = "main.typ"
